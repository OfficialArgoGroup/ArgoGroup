<!doctype html>
<html lang="en" data-theme="cream">
  <head>
    <meta charset="UTF-8" />
    <!-- The brandbook monogram. Own filenames on purpose: /favicon.* still
         belong to the /growth and /systems landings. -->
    <link rel="icon" href="/argo-favicon.ico?v=2" sizes="48x48">
    <link rel="icon" href="/argo-icon.svg?v=2" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/argo-apple-touch-icon.png?v=2">
    <meta name="theme-color" content="#FBF9F5" />

    <!-- Display serif + UI sans the design system is built on, self-hosted
         (src/styles/fonts.css): no request to Google, so no visitor IP leaves
         before consent. Preloaded so the first paint does not wait for the CSS.
         Above head-start on purpose: everything between the markers is replaced
         by the SSR head on every prerendered page, which would drop these. -->
    <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/playfair-display-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google Search Console ownership verification. Deliberately above
         head-start: everything between the markers is replaced by the SSR head
         on every prerendered page, which would strip this tag. Removing it
         un-verifies the property and stops the sitemap being read. -->
    <meta name="google-site-verification" content="Y1wLZLx_34tKXV3IgvtwGN-WVLTdPYERMRzpAFsbkmY" />
    <!--head-start-->
    <title>Group ARGO | Growth, Digital Marketing & AI Technology</title>
    <meta name="description" content="A 360 growth partner, not an agency: digital marketing, systems, custom software and brand, built around your business. Request a discovery call." />
    <link rel="canonical" href="https://www.groupargous.com/" />
    <link rel="alternate" type="text/markdown" href="https://www.groupargous.com/index.md" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.groupargous.com/" />
    <meta property="og:title" content="Group ARGO | Growth, Digital Marketing & AI Technology" />
    <meta property="og:description" content="A 360 growth partner, not an agency: digital marketing, systems, custom software and brand, built around your business. Request a discovery call." />
    <meta property="og:image" content="https://www.groupargous.com/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--head-end-->
    <!-- Scroll-reveal elements start hidden and are revealed by JavaScript.
         Without JavaScript there is nothing to reveal them, so show them up front. -->
    <noscript>
      <style>
        [data-reveal],
        [data-reveal] .split-char,
        .section-head .eyebrow,
        .section-head .section-sub {
          opacity: 1 !important;
          transform: none !important;
          filter: none !important;
          transition: none !important;
        }
      </style>
    </noscript>
    <!-- The Meta Pixel is not here on purpose: src/lib/pixel.js loads it only
         after the visitor accepts cookies. -->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
